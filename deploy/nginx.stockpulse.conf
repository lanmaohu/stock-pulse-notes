server {
  listen 80;
  listen [::]:80;
  server_name stockpulse.com.cn www.stockpulse.com.cn;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    allow all;
  }

  location / {
    return 301 https://stockpulse.com.cn$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.stockpulse.com.cn;

  ssl_certificate /etc/letsencrypt/live/stockpulse.com.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stockpulse.com.cn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://stockpulse.com.cn$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name stockpulse.com.cn;

  ssl_certificate /etc/letsencrypt/live/stockpulse.com.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stockpulse.com.cn/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/stockpulse/current/dist;
  index index.html;
  client_max_body_size 2m;

  location ~ ^/api/content-items/[^/]+/analysis-retry$ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 120s;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  location ~* ^/assets/.*\.(?:css|js|woff2?|png|jpe?g|gif|svg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location = /app {
    return 301 /$is_args$args;
  }

  location = /app/ {
    return 301 /$is_args$args;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
